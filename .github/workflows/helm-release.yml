name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          helm package helm/tagwatcher-agent/ --destination .chart-output/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update index and push to gh-pages
        run: |
          cp .chart-output/*.tgz gh-pages/
          helm repo index gh-pages/ \
            --url https://rolestack.github.io/TagWatcher-Agent \
            --merge gh-pages/index.yaml
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: release $(ls ../.chart-output/*.tgz | xargs basename)"
          git push
