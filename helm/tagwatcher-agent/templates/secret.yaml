{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tagwatcher-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "tagwatcher-agent.name" . }}
type: Opaque
stringData:
  registrationToken: {{ required "secret.registrationToken is required when secret.create=true" .Values.secret.registrationToken | quote }}
{{- end }}
